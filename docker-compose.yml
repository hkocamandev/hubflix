version: '3.8'

services:
  express-service:
    build: .
    # npm betiğini kullanın
    command: npm run start:express
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/hubflix"

  core-service:
    build: .
    # npm betiğini kullanın
    command: npm run start:core
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
    environment:
      MONGO_URI: "mongodb://mongo:27017/hubflix"
      REDIS_HOST: redis
      REDIS_PORT: 6379

  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  data-importer:
    build: .
    command: npm run start:importer
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/hubflix"

  tests:
    build: .
    depends_on:
      - mongo
    command: npm run test:coreNode