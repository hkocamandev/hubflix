<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hubflix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo img {
      height: 80px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      background: #fff;
    }
    table th, table td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    table th {
      background-color: #eee;
    }
    .pagination {
      margin-top: 15px;
      text-align: center;
    }
    .pagination button {
      margin: 0 3px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="https://dummyimage.com/200x80/000/fff&text=Hubflix" alt="Hubflix Logo">
  </div>

  <h2>Movies</h2>
  <table id="moviesTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Release Date</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="pagination" id="pagination"></div>

  <h2>Director Info</h2>
  <table id="directorTable">
    <thead>
      <tr>
        <th>First Name</th>
        <th>Second Name</th>
        <th>Birth Date</th>
        <th>Bio</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const moviesTableBody = document.querySelector("#moviesTable tbody");
    const directorTableBody = document.querySelector("#directorTable tbody");
    const paginationDiv = document.getElementById("pagination");

    let movies = [];
    let currentPage = 1;
    const pageSize = 10;

    async function fetchMovies() {
      const res = await fetch("http://localhost:4000/movies", {
        headers: { "Authorization": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjEyMyIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTc1NTM2Mjg4MCwiZXhwIjoxNzU2MjUyNzk5fQ.V6y3VBErgQNU2ewp7YbdPhVe2jc-5XroWZRJjE2z-tM" }
      });
      movies = await res.json();
      renderMovies();
      renderPagination();
    }

    function renderMovies() {
      moviesTableBody.innerHTML = "";
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageMovies = movies.slice(start, end);

      pageMovies.forEach((m) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.title}</td>
          <td>${m.genre}</td>
          <td>${m.rating}</td>
          <td>${new Date(m.releaseDate).toLocaleDateString()}</td>
        `;
        tr.addEventListener("click", () => fetchDirector(m.director));
        moviesTableBody.appendChild(tr);
      });
    }

    function renderPagination() {
      paginationDiv.innerHTML = "";
      const pageCount = Math.ceil(movies.length / pageSize);
      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.disabled = i === currentPage;
        btn.addEventListener("click", () => {
          currentPage = i;
          renderMovies();
        });
        paginationDiv.appendChild(btn);
      }
    }

    async function fetchDirector(directorId) {
      const res = await fetch("http://localhost:4000/directors/" + directorId, {
        headers: { "Authorization": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjEyMyIsInJvbGUiOiJhZG1pbiIsImlhdCI6MTc1NTM2Mjg4MCwiZXhwIjoxNzU2MjUyNzk5fQ.V6y3VBErgQNU2ewp7YbdPhVe2jc-5XroWZRJjE2z-tM" }
      });
      const d = await res.json();
      directorTableBody.innerHTML = `
        <tr>
          <td>${d.firstName}</td>
          <td>${d.secondName}</td>
          <td>${new Date(d.birthDate).toLocaleDateString()}</td>
          <td>${d.bio || ""}</td>
        </tr>
      `;
    }

    fetchMovies();
  </script>
</body>
</html>
